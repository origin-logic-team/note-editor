<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Editor | Origin Logic Team</title>
    <style>
        :root {
            --e-paper-white: #f4f4f4;
            --e-paper-black: #1a1a1a;
            --slate-blue: #5f9ea0;
            --border-color: #d1d1d1;
        }

        body {
            background-color: var(--e-paper-white);
            color: var(--e-paper-black);
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        header {
            border-bottom: 2px solid var(--e-paper-black);
            margin-bottom: 20px;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .back-link {
            text-decoration: none;
            color: var(--slate-blue);
            font-size: 0.9rem;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        h1 {
            margin: 10px 0 5px 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }

        .disclaimer-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 1px 1px 0px var(--border-color);
            text-decoration: none;
            color: var(--e-paper-black);
        }

        .disclaimer-btn:hover {
            background: var(--e-paper-black);
            color: var(--e-paper-white);
        }

        /* 內容顯示區 */
        #content-box {
            white-space: pre-wrap;
            word-wrap: break-word;
            background-color: #ffffff;
            padding: 25px;
            border: 1px solid var(--border-color);
            min-height: 300px;
            box-shadow: 4px 4px 0px var(--border-color);
        }

        .loading-text {
            color: #888;
            font-style: italic;
        }

        .error-text {
            color: #b22222;
            font-weight: bold;
        }

        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            text-align: center;
            color: #666;
            border-top: 1px dashed var(--border-color);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <a href="https://origin-logic-team.github.io" class="back-link">← BACK TO HUB</a>
                <h1 id="repo-title">LOADING...</h1>
            </div>
            <a href="#disclaimer-section" class="disclaimer-btn">免責聲明</a>
        </header>

        <main id="content-box" class="loading-text">
            正在載入筆記內容...
        </main>

        <footer id="disclaimer-section">
            <p><strong>免責聲明與資訊</strong></p>
            <p>1. 本應用程式（App）僅作為文字編輯與資料整理之免費工具，與使用者輸入或處理之內容無關。</p>
            <p>2. 資料完全於瀏覽器本機端運行，使用者須自行承擔資料保存與使用之所有責任。</p>
            <p>Origin Logic Team | Note Editor System</p>
        </footer>
    </div>

    <script>
        async function fetchLog() {
            const contentBox = document.getElementById('content-box');
            const titleElement = document.getElementById('repo-title');
            
            try {
                const response = await fetch('./log_content.txt');
                
                if (!response.ok) {
                    throw new Error('STATUS_404: 找不到 log_content.txt');
                }
                
                const rawText = await response.text();

                const titleMatch = rawText.match(/<title>([\s\S]*?)<\/title>/);
                const titleText = titleMatch ? titleMatch[1].trim() : "NOTE_EDITOR";
                
                const cleanContent = rawText.replace(/<title>[\s\S]*?<\/title>/, "").trim();

                titleElement.innerText = titleText;
                contentBox.innerText = cleanContent;
                contentBox.classList.remove('loading-text');

            } catch (err) {
                titleElement.innerText = "SYSTEM_ERROR";
                contentBox.innerHTML = `<span class="error-text">[錯誤] ${err.message}</span><br><br>請確保根目錄下存在 log_content.txt 檔案。`;
            }
        }

        window.onload = fetchLog;
    </script>

</body>
</html>
